<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Fetcher - Gmail & Outlook Integration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Email Fetcher</h1>
            <p>Connect your Gmail and Outlook accounts</p>
        </header>

        <div class="auth-section">
            <h2>Connect Your Email Accounts</h2>
            <div class="auth-buttons">
                <button id="googleAuthBtn" class="auth-btn google-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
                        <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
                        <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
                        <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
                    </svg>
                    Connect Gmail
                </button>
                <button id="outlookAuthBtn" class="auth-btn outlook-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path fill="#0078D4" d="M10 0C4.48 0 0 4.48 0 10s4.48 10 10 10 10-4.48 10-10S15.52 0 10 0zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        <path fill="#0078D4" d="M10 5c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
                    </svg>
                    Connect Outlook
                </button>
            </div>
            <div id="authStatus" class="auth-status"></div>
        </div>

        <div id="emailContainer" class="email-container" style="display: none;">
            <div class="controls">
                <select id="accountSelector" class="account-selector">
                    <option value="">Select Account</option>
                </select>
                <button id="fetchEmailsBtn" class="fetch-btn">Fetch Emails</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>

            <div class="email-stats">
                <div class="stat-item">
                    <span class="stat-label">Total Emails:</span>
                    <span id="totalEmails" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Unread:</span>
                    <span id="unreadEmails" class="stat-value">0</span>
                </div>
            </div>

            <div id="emailList" class="email-list">
                <!-- Emails will be populated here -->
            </div>
        </div>

        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Loading emails...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://alcdn.msauth.net/browser/2.28.1/js/msal-browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
