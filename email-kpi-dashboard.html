<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email KPI Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .controls select {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 16px;
            margin-right: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .kpi-card h3 {
            color: #667eea;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .kpi-subtitle {
            color: #666;
            font-size: 12px;
        }

        .email-list {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .email-list h2 {
            background: #667eea;
            color: white;
            padding: 20px;
            margin: 0;
        }

        .email-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .email-item:hover {
            background: #f8f9fa;
        }

        .email-item.unread {
            background: #f0f4ff;
            font-weight: 600;
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .email-from {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .email-date {
            color: #666;
            font-size: 14px;
        }

        .email-subject {
            color: #667eea;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .email-preview {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        .email-tags {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag.high {
            background: #fee;
            color: #c33;
        }

        .tag.medium {
            background: #ffeaa7;
            color: #d63031;
        }

        .tag.low {
            background: #dfe6e9;
            color: #2d3436;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .chart-container h3 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bar-label {
            min-width: 150px;
            font-weight: 500;
            color: #333;
        }

        .bar-container {
            flex: 1;
            background: #f0f0f0;
            height: 30px;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email KPI Dashboard</h1>

        <div class="controls">
            <button onclick="refreshData()">🔄 Refresh Data</button>
            <button onclick="loadSampleData()">📥 Load Sample Emails</button>
            <select id="timeFilter" onchange="filterByTime()">
                <option value="all">All Time</option>
                <option value="today">Today</option>
                <option value="week">This Week</option>
                <option value="month">This Month</option>
            </select>
            <select id="priorityFilter" onchange="filterByPriority()">
                <option value="all">All Priorities</option>
                <option value="high">High Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="low">Low Priority</option>
            </select>
        </div>

        <div class="kpi-grid" id="kpiGrid">
            <!-- KPI cards will be inserted here -->
        </div>

        <div class="chart-container">
            <h3>📊 Top Email Senders</h3>
            <div class="bar-chart" id="senderChart"></div>
        </div>

        <div class="chart-container">
            <h3>📈 Emails by Priority</h3>
            <div class="bar-chart" id="priorityChart"></div>
        </div>

        <div class="email-list">
            <h2>📬 Email Inbox</h2>
            <div id="emailContainer">
                <div class="loading">Loading emails...</div>
            </div>
        </div>
    </div>

    <script>
        // Sample email data
        let allEmails = [];
        let filteredEmails = [];

        function generateSampleEmails() {
            const senders = [
                'john.doe@company.com',
                'sarah.smith@partner.com',
                'mike.johnson@client.com',
                'emily.brown@vendor.com',
                'david.wilson@support.com',
                'lisa.anderson@marketing.com',
                'robert.taylor@sales.com',
                'jennifer.white@hr.com'
            ];

            const subjects = [
                'Q4 Project Status Update',
                'Meeting Follow-up: Action Items',
                'Urgent: Server Maintenance Required',
                'Weekly Team Sync Notes',
                'Budget Approval Request',
                'Customer Feedback Summary',
                'New Feature Proposal',
                'Performance Review Schedule',
                'Contract Renewal Discussion',
                'Marketing Campaign Results',
                'System Alert Notification',
                'Invoice #12345 - Payment Due',
                'Training Session Registration',
                'Policy Update Announcement',
                'Collaboration Opportunity'
            ];

            const priorities = ['high', 'medium', 'low'];
            const emails = [];

            for (let i = 0; i < 50; i++) {
                const daysAgo = Math.floor(Math.random() * 30);
                const date = new Date();
                date.setDate(date.getDate() - daysAgo);

                emails.push({
                    id: i,
                    from: senders[Math.floor(Math.random() * senders.length)],
                    subject: subjects[Math.floor(Math.random() * subjects.length)],
                    preview: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.',
                    date: date,
                    priority: priorities[Math.floor(Math.random() * priorities.length)],
                    read: Math.random() > 0.3,
                    responseTime: Math.random() > 0.5 ? Math.floor(Math.random() * 48) : null // hours
                });
            }

            return emails.sort((a, b) => b.date - a.date);
        }

        function calculateKPIs(emails) {
            const totalEmails = emails.length;
            const unreadEmails = emails.filter(e => !e.read).length;
            const highPriority = emails.filter(e => e.priority === 'high').length;

            const emailsWithResponse = emails.filter(e => e.responseTime !== null);
            const avgResponseTime = emailsWithResponse.length > 0
                ? (emailsWithResponse.reduce((sum, e) => sum + e.responseTime, 0) / emailsWithResponse.length).toFixed(1)
                : 0;

            const today = new Date();
            const todayEmails = emails.filter(e => {
                const emailDate = new Date(e.date);
                return emailDate.toDateString() === today.toDateString();
            }).length;

            const thisWeek = new Date();
            thisWeek.setDate(thisWeek.getDate() - 7);
            const weekEmails = emails.filter(e => new Date(e.date) >= thisWeek).length;

            // Count unique senders
            const uniqueSenders = new Set(emails.map(e => e.from)).size;

            return {
                totalEmails,
                unreadEmails,
                highPriority,
                avgResponseTime,
                todayEmails,
                weekEmails,
                uniqueSenders,
                readRate: ((totalEmails - unreadEmails) / totalEmails * 100).toFixed(1)
            };
        }

        function renderKPIs(kpis) {
            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = `
                <div class="kpi-card">
                    <h3>Total Emails</h3>
                    <div class="kpi-value">${kpis.totalEmails}</div>
                    <div class="kpi-subtitle">All time messages</div>
                </div>
                <div class="kpi-card">
                    <h3>Unread Emails</h3>
                    <div class="kpi-value">${kpis.unreadEmails}</div>
                    <div class="kpi-subtitle">${kpis.readRate}% read rate</div>
                </div>
                <div class="kpi-card">
                    <h3>High Priority</h3>
                    <div class="kpi-value">${kpis.highPriority}</div>
                    <div class="kpi-subtitle">Urgent items</div>
                </div>
                <div class="kpi-card">
                    <h3>Avg Response Time</h3>
                    <div class="kpi-value">${kpis.avgResponseTime}h</div>
                    <div class="kpi-subtitle">Hours to respond</div>
                </div>
                <div class="kpi-card">
                    <h3>Today's Emails</h3>
                    <div class="kpi-value">${kpis.todayEmails}</div>
                    <div class="kpi-subtitle">Received today</div>
                </div>
                <div class="kpi-card">
                    <h3>This Week</h3>
                    <div class="kpi-value">${kpis.weekEmails}</div>
                    <div class="kpi-subtitle">Last 7 days</div>
                </div>
                <div class="kpi-card">
                    <h3>Unique Senders</h3>
                    <div class="kpi-value">${kpis.uniqueSenders}</div>
                    <div class="kpi-subtitle">Different contacts</div>
                </div>
                <div class="kpi-card">
                    <h3>Read Rate</h3>
                    <div class="kpi-value">${kpis.readRate}%</div>
                    <div class="kpi-subtitle">Email engagement</div>
                </div>
            `;
        }

        function renderSenderChart(emails) {
            const senderCounts = {};
            emails.forEach(email => {
                senderCounts[email.from] = (senderCounts[email.from] || 0) + 1;
            });

            const sortedSenders = Object.entries(senderCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const maxCount = sortedSenders[0]?.[1] || 1;

            const chartHTML = sortedSenders.map(([sender, count]) => {
                const percentage = (count / maxCount) * 100;
                return `
                    <div class="bar-item">
                        <div class="bar-label">${sender}</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%">${count}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('senderChart').innerHTML = chartHTML || '<p>No data available</p>';
        }

        function renderPriorityChart(emails) {
            const priorityCounts = {
                high: emails.filter(e => e.priority === 'high').length,
                medium: emails.filter(e => e.priority === 'medium').length,
                low: emails.filter(e => e.priority === 'low').length
            };

            const maxCount = Math.max(...Object.values(priorityCounts));

            const chartHTML = Object.entries(priorityCounts).map(([priority, count]) => {
                const percentage = maxCount > 0 ? (count / maxCount) * 100 : 0;
                return `
                    <div class="bar-item">
                        <div class="bar-label">${priority.charAt(0).toUpperCase() + priority.slice(1)} Priority</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%">${count}</div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('priorityChart').innerHTML = chartHTML;
        }

        function renderEmails(emails) {
            const container = document.getElementById('emailContainer');

            if (emails.length === 0) {
                container.innerHTML = '<div class="loading">No emails found</div>';
                return;
            }

            container.innerHTML = emails.map(email => `
                <div class="email-item ${email.read ? '' : 'unread'}" onclick="markAsRead(${email.id})">
                    <div class="email-header">
                        <div class="email-from">${email.from}</div>
                        <div class="email-date">${formatDate(email.date)}</div>
                    </div>
                    <div class="email-subject">${email.subject}</div>
                    <div class="email-preview">${email.preview}</div>
                    <div class="email-tags">
                        <span class="tag ${email.priority}">${email.priority.toUpperCase()}</span>
                        ${!email.read ? '<span class="tag" style="background: #667eea; color: white;">UNREAD</span>' : ''}
                        ${email.responseTime !== null ? `<span class="tag" style="background: #00b894; color: white;">Responded in ${email.responseTime}h</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function formatDate(date) {
            const now = new Date();
            const diff = now - new Date(date);
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) return 'Today';
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days} days ago`;

            return new Date(date).toLocaleDateString();
        }

        function markAsRead(emailId) {
            const email = allEmails.find(e => e.id === emailId);
            if (email) {
                email.read = true;
                updateDashboard();
            }
        }

        function filterByTime() {
            const filter = document.getElementById('timeFilter').value;
            const now = new Date();

            filteredEmails = allEmails.filter(email => {
                const emailDate = new Date(email.date);
                switch(filter) {
                    case 'today':
                        return emailDate.toDateString() === now.toDateString();
                    case 'week':
                        const weekAgo = new Date(now);
                        weekAgo.setDate(weekAgo.getDate() - 7);
                        return emailDate >= weekAgo;
                    case 'month':
                        const monthAgo = new Date(now);
                        monthAgo.setMonth(monthAgo.getMonth() - 1);
                        return emailDate >= monthAgo;
                    default:
                        return true;
                }
            });

            applyPriorityFilter();
        }

        function filterByPriority() {
            applyPriorityFilter();
        }

        function applyPriorityFilter() {
            const priorityFilter = document.getElementById('priorityFilter').value;

            let emails = filteredEmails.length > 0 ? filteredEmails : allEmails;

            if (priorityFilter !== 'all') {
                emails = emails.filter(e => e.priority === priorityFilter);
            }

            updateDashboard(emails);
        }

        function updateDashboard(emails = allEmails) {
            const kpis = calculateKPIs(emails);
            renderKPIs(kpis);
            renderSenderChart(emails);
            renderPriorityChart(emails);
            renderEmails(emails);
        }

        function loadSampleData() {
            allEmails = generateSampleEmails();
            filteredEmails = [];
            document.getElementById('timeFilter').value = 'all';
            document.getElementById('priorityFilter').value = 'all';
            updateDashboard();
        }

        function refreshData() {
            loadSampleData();
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadSampleData();
        });
    </script>
</body>
</html>
