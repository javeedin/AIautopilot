<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Development Activity Log - ERP Project Manager</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>📝 Development Activity Log</h1>
                    <p class="subtitle">Real-time tracking of all development activities</p>
                </div>
                <div class="page-actions">
                    <button class="btn-refresh" onclick="window.location.reload()">🔄 Refresh</button>
                </div>
            </header>

            <section class="kpi-section">
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #3b82f6;">📊</div>
                    <div class="kpi-content">
                        <h3 class="kpi-value" id="total-activities">0</h3>
                        <p class="kpi-label">Total Activities</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #10b981;">✅</div>
                    <div class="kpi-content">
                        <h3 class="kpi-value" id="completed-activities">0</h3>
                        <p class="kpi-label">Completed</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #ef4444;">❌</div>
                    <div class="kpi-content">
                        <h3 class="kpi-value" id="failed-activities">0</h3>
                        <p class="kpi-label">Failed/Errors</p>
                    </div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="background: #8b5cf6;">⏱️</div>
                    <div class="kpi-content">
                        <h3 class="kpi-value" id="total-time">0h</h3>
                        <p class="kpi-label">Total Time Spent</p>
                    </div>
                </div>
            </section>

            <section class="filter-section">
                <div class="filter-group">
                    <label for="module-filter">Module:</label>
                    <select id="module-filter" onchange="updateActivityListing()">
                        <option value="all">All Modules</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="page-filter">Page ID:</label>
                    <input type="text" id="page-filter" placeholder="Filter by Page ID..." onkeyup="updateActivityListing()">
                </div>
                <div class="filter-group">
                    <label for="action-filter">Action Type:</label>
                    <select id="action-filter" onchange="updateActivityListing()">
                        <option value="all">All Actions</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter" onchange="updateActivityListing()">
                        <option value="all">All Status</option>
                        <option value="Completed">✅ Completed</option>
                        <option value="In Progress">🔄 In Progress</option>
                        <option value="Failed">❌ Failed</option>
                    </select>
                </div>
            </section>

            <section class="table-section">
                <div class="table-card">
                    <div class="table-header">
                        <h2>📋 Activity Log</h2>
                        <span id="filtered-count">0 activities</span>
                    </div>
                    <div class="table-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Module</th>
                                    <th>Page ID</th>
                                    <th>Feature ID</th>
                                    <th>Action Type</th>
                                    <th>Description</th>
                                    <th>Time (min)</th>
                                    <th>Status</th>
                                    <th>Error Details</th>
                                </tr>
                            </thead>
                            <tbody id="activity-table-body">
                                <tr><td colspan="9" style="text-align: center; padding: 40px;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dev-activity-log.js"></script>
</body>
</html>
