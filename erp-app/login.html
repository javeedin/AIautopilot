<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Login - Oracle Fusion ERP</title>
    <link rel="stylesheet" href="css/erp-main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">🏢</div>
                <h1 class="login-title">Oracle Fusion ERP</h1>
                <p class="login-subtitle">Sign in to continue</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="instance">Instance Name</label>
                    <input
                        type="text"
                        id="instance"
                        class="form-input"
                        placeholder="Enter instance name"
                        required
                        autocomplete="off"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    />
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #9ca3af;">
                <p>Oracle Fusion ERP v1.0</p>
                <p style="margin-top: 8px;">Need help? Contact IT Support</p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
